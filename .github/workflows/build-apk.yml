name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 必须用 v4，不能用 v3。
      #
      # v3 的 packages 默认值里含已废弃的 `tools` 包，而 Google 已把它从
      # repository2-3.xml 下架，`sdkmanager tools` 会直接 exit 1 导致这一步
      # 失败（官方 issue #537）。v4 删掉了这个默认值，即为该问题的修复。
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 显式接受 SDK 许可协议，否则 Gradle 自动补装组件时会失败
          accept-android-sdk-licenses: true
          # 显式装好编译 Capacitor 7 所需的组件（compileSdk 35）。
          # 注意：这里不要出现 `tools`，那正是上面那个坑。
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: 打印构建环境
        run: |
          echo "---- Java ----"
          java -version 2>&1 || true
          echo "---- Android SDK ----"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<未设置>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"
          echo "---- Node / npm ----"
          node -v
          npm -v

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 资源
        run: npm run build

      - name: 生成 Android 原生工程
        run: npx cap add android

      - name: 同步 Web 资源与插件到原生工程
        run: npx cap sync android

      # 前台服务（后台下载保活）的权限与 service/receiver 必须注入到 app 的
      # manifest：插件只在它自己的 manifest 里声明了 POST_NOTIFICATIONS。
      # 这一步必须在 cap add/sync 之后、编译之前执行。
      - name: 注入后台下载所需的原生配置
        run: npm run patch:android

      - name: 生成应用图标与启动图
        run: |
          if [ -f resources/icon.png ]; then
            npx --yes @capacitor/assets generate --android || echo "图标生成失败，沿用默认图标"
          else
            echo "未提供 resources/icon.png，沿用 Capacitor 默认图标"
          fi

      - name: 放行明文 HTTP 资源站
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          grep -n 'usesCleartextTraffic' "$MANIFEST"

      # 全程落盘到 build-log.txt，并把输出同时打到日志里。
      # 这样一旦编译失败，错误原因会直接显示在这一步的日志中，
      # 不需要再去猜是哪一环出的问题。
      #
      # set -o pipefail 不能省：GitHub Actions 默认只开 -e，
      # 管道的退出码取最后一个命令（tee），会把编译失败误报成成功。
      - name: 编译 Debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: 失败时回显错误摘要
        if: failure()
        run: |
          LOG=android/build-log.txt
          if [ -f "$LOG" ]; then
            echo "## ❌ 构建失败，以下是关键错误" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error|failed|exception|could not|unsupported|no such" "$LOG" | tail -40 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "---- 日志末尾 60 行 ----"
            tail -60 "$LOG"
          else
            echo "未生成 build-log.txt，失败发生在编译之前的步骤"
          fi

      - name: 失败时保存构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build-log.txt
          if-no-files-found: ignore

      - name: 记录 APK 信息
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: cinedesk-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 90

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: 影视大全 ${{ github.ref_name }}
          body: |
            下载 `app-debug.apk` 安装到手机即可使用。

            安装时系统会提示「未知来源应用」，允许后继续即可（Debug 包未使用发布证书签名）。
          draft: false

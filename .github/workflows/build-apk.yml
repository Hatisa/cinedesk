name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 资源
        run: npm run build

      - name: 生成 Android 原生工程
        run: npx cap add android

      - name: 同步 Web 资源与插件到原生工程
        run: npx cap sync android

      - name: 生成应用图标与启动图
        run: |
          if [ -f resources/icon.png ]; then
            npx --yes @capacitor/assets generate --android || echo "图标生成失败，沿用默认图标"
          else
            echo "未提供 resources/icon.png，沿用 Capacitor 默认图标"
          fi

      - name: 放行明文 HTTP 资源站
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          grep -n 'usesCleartextTraffic' "$MANIFEST"

      - name: 编译 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 记录 APK 信息
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: cinedesk-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 90

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: 影视大全 ${{ github.ref_name }}
          body: |
            下载 `app-debug.apk` 安装到手机即可使用。

            安装时系统会提示「未知来源应用」，允许后继续即可（Debug 包未使用发布证书签名）。
          draft: false
